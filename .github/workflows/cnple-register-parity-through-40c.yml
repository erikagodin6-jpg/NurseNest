name: CNPLE Register Parity through 40C

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/cnple-register-parity-through-40c.yml"
      - "content-authoring/cnple/cram/*.json"
      - "content-authoring/cnple/cram/AUTHORING_QA_PARITY_*.md"

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-endocrine-40c-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-endocrine-40c-20260809
          fetch-depth: 0

      - name: Validate and register audited parity through Endocrine 40C
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('content-authoring/cnple/cram')
          manifest_path = root / 'manifest.json'
          m = json.loads(manifest_path.read_text())
          assert (m['rawLessonObjects'], m['uniqueLessonIds'], m['canonicalTopicPathways'], m['clinicalJsonFiles']) == (426,426,418,42)
          assert m['explicitCanonicalSupersessions'] == 8

          pending = [
            ('38d-lab-cbc-electrolyte-acid-base-parity.json', 8, 'AUTHORING_QA_PARITY_38D.md'),
            ('38e-lab-advanced-patterns-parity.json', 8, 'AUTHORING_QA_PARITY_38E.md'),
            ('39a-respiratory-advanced-parity.json', 6, 'AUTHORING_QA_PARITY_39A.md'),
            ('39b-respiratory-diagnostics-procedures-parity.json', 5, 'AUTHORING_QA_PARITY_39B.md'),
            ('39c-respiratory-diagnostics-screening-parity.json', 8, 'AUTHORING_QA_PARITY_39C.md'),
            ('39d-respiratory-core-completion-parity.json', 6, 'AUTHORING_QA_PARITY_39D.md'),
            ('40a-endocrine-diabetes-parity.json', 8, 'AUTHORING_QA_PARITY_40A.md'),
            ('40b-endocrine-thyroid-adrenal-parathyroid-parity.json', 8, 'AUTHORING_QA_PARITY_40B.md'),
            ('40c-endocrine-bone-metabolic-parity.json', 10, 'AUTHORING_QA_PARITY_40C.md'),
          ]

          required = set(m['requiredLessonFields'])
          registered = {x['path'] for x in m['files']}
          assert not registered.intersection({p for p,_,_ in pending})

          ids=set(); count=0
          for entry in m['files']:
            rows=json.loads((root/entry['path']).read_text())
            assert isinstance(rows,list) and len(rows)==entry['lessons'], entry['path']
            count += len(rows)
            for row in rows:
              assert required.issubset(row.keys()), f"missing fields:{entry['path']}:{row.get('id')}"
              assert row['id'] not in ids, f"duplicate:{row['id']}"
              ids.add(row['id'])
          assert count==426 and len(ids)==426

          for path,n,qa in pending:
            p=root/path; q=root/qa
            assert p.exists(), path
            assert q.exists(), qa
            rows=json.loads(p.read_text())
            assert isinstance(rows,list) and len(rows)==n, f"{path}:{len(rows)}"
            for row in rows:
              assert required.issubset(row.keys()), f"missing fields:{path}:{row.get('id')}"
              assert isinstance(row['id'],str) and row['id'].strip()
              assert row['id'] not in ids, f"duplicate:{row['id']}"
              ids.add(row['id'])
            m['files'].append({'path':path,'lessons':n,'role':'full_lesson_parity_expansion'})
            if qa not in m['auditDocuments']:
              m['auditDocuments'].append(qa)

          assert len(ids)==493, len(ids)
          m['rawLessonObjects']=493
          m['uniqueLessonIds']=493
          m['canonicalTopicPathways']=485
          m['clinicalJsonFiles']=51
          m['sourceRefreshDate']='2026-08-09'
          m['fullLessonParity']['authoringCanonicalTopicPathways']=485
          pub=m['publication']
          for key in ['38D','38E','39A','39B','39C','39D','40A','40B','40C']:
            pub[f'secondPassClinicalAuditCompleteForParity{key}']=True
          pub['newExpansionBatchPendingSecondPassAudit']=False
          pub['note']=(
            'The 493-object CNPLE Cram V2 estate contains the audited topic baseline plus clinically reviewed Full-lesson parity expansions. '
            'The canonical shared Lab Interpretation, Respiratory, and Endocrine NP-generator families now have complete clinical authoring coverage. '
            'Global Full-lesson parity remains incomplete; private-core reconciliation, source anchors, Bottom Line evidence, Quick Checks, runtime certification, and learner rendering remain mandatory.'
          )
          manifest_path.write_text(json.dumps(m,indent=2)+'\n')

          check=json.loads(manifest_path.read_text())
          assert len(check['files'])==51
          ids2=set(); count2=0
          for entry in check['files']:
            rows=json.loads((root/entry['path']).read_text())
            assert len(rows)==entry['lessons']
            count2 += len(rows)
            for row in rows:
              assert required.issubset(row.keys())
              assert row['id'] not in ids2
              ids2.add(row['id'])
          assert (count2,len(ids2),check['canonicalTopicPathways'])==(493,493,485)
          print(json.dumps({'rawLessonObjects':493,'uniqueLessonIds':493,'canonicalTopicPathways':485,'clinicalJsonFiles':51}))
          PY

      - name: Commit governed manifest registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-register-parity-through-40c.yml
          git add content-authoring/cnple/cram/manifest.json
          git diff --cached --check
          git commit -m 'content(cnple-cram): register lab respiratory and endocrine parity'
          git push origin HEAD:content/cnple-cram-parity-endocrine-40c-20260809
