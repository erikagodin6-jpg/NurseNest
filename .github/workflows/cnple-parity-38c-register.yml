name: CNPLE Parity 38C Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-parity-38c-register.yml
      - content-authoring/cnple/cram/38c-lab-liver-inflammation-endocrine-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_38C.md

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-labs-38c-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-labs-38c-20260808
          fetch-depth: 0
      - name: Register and globally validate parity 38C
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const root = 'content-authoring/cnple/cram';
          const manifestPath = `${root}/manifest.json`;
          const batchPath = '38c-lab-liver-inflammation-endocrine-parity.json';
          const auditDoc = 'AUTHORING_QA_PARITY_38C.md';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.rawLessonObjects !== 418 || manifest.uniqueLessonIds !== 418 || manifest.canonicalTopicPathways !== 410 || manifest.clinicalJsonFiles !== 41) {
            throw new Error(`unexpected predecessor state ${manifest.rawLessonObjects}/${manifest.uniqueLessonIds}/${manifest.canonicalTopicPathways}/${manifest.clinicalJsonFiles}`);
          }
          if (manifest.files.some(f => f.path === batchPath)) throw new Error('38C already registered');
          const batch = JSON.parse(fs.readFileSync(`${root}/${batchPath}`, 'utf8'));
          const expected = [
            'lab-ast-and-alt','lab-bilirubin-and-jaundice','lab-liver-function-patterns','lab-crp',
            'lab-esr','lab-procalcitonin','lab-thyroid-function-tests','lab-glucose-interpretation'
          ].sort();
          const ids = batch.map(x => x.id).sort();
          if (JSON.stringify(ids) !== JSON.stringify(expected)) throw new Error(`38C IDs mismatch: ${JSON.stringify(ids)}`);
          if (batch.length !== 8) throw new Error(`38C count ${batch.length}`);
          manifest.rawLessonObjects = 426;
          manifest.uniqueLessonIds = 426;
          manifest.canonicalTopicPathways = 418;
          manifest.clinicalJsonFiles = 42;
          manifest.files.push({path: batchPath, lessons: 8, role: 'full_lesson_parity_expansion'});
          if (!manifest.auditDocuments.includes(auditDoc)) manifest.auditDocuments.push(auditDoc);
          manifest.fullLessonParity.authoringCanonicalTopicPathways = 418;
          manifest.publication.secondPassClinicalAuditCompleteForParity38C = true;
          manifest.publication.newExpansionBatchPendingSecondPassAudit = false;
          manifest.publication.note = 'The 426-object library is an audited topic baseline plus active specialty/full-lesson parity expansions; it is not complete Full-lesson parity. Batches 37, 38A, 38B and 38C have passed clinical second-pass review, while exact current Full identity/source-anchor/Quick-Check/runtime certification remains fail-closed in private-core. CNPLE Cram authoring remains open until reverse coverage reaches 100% and all serving gates certify.';

          const required = manifest.requiredLessonFields;
          const seen = new Set();
          let total = 0;
          for (const f of manifest.files) {
            const rows = JSON.parse(fs.readFileSync(`${root}/${f.path}`, 'utf8'));
            if (!Array.isArray(rows) || rows.length !== f.lessons) throw new Error(`${f.path}: count mismatch`);
            for (const row of rows) {
              total++;
              if (typeof row.id !== 'string' || !row.id.trim()) throw new Error(`${f.path}: invalid id`);
              if (seen.has(row.id)) throw new Error(`duplicate id ${row.id}`);
              seen.add(row.id);
              for (const field of required) {
                if (!(field in row)) throw new Error(`${row.id}: missing ${field}`);
                const value = row[field];
                if (typeof value === 'string' && !value.trim()) throw new Error(`${row.id}: empty ${field}`);
                if (Array.isArray(value) && value.length === 0) throw new Error(`${row.id}: empty ${field}`);
              }
            }
          }
          if (total !== 426 || seen.size !== 426) throw new Error(`global count ${total}/${seen.size}`);
          if (manifest.files.length !== 42) throw new Error(`manifest files ${manifest.files.length}`);
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log(JSON.stringify({total, unique:seen.size, pathways:manifest.canonicalTopicPathways, files:manifest.files.length}, null, 2));
          NODE
          git diff --check -- content-authoring/cnple/cram/manifest.json
      - name: Commit governed registration and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE parity registrar'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-parity-38c-register.yml
          git add content-authoring/cnple/cram/manifest.json
          git diff --cached --check
          git commit -m 'audit(cnple-cram): register parity batch 38C'
          git push origin HEAD:content/cnple-cram-parity-labs-38c-20260808
