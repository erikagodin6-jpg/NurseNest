name: CNPLE Parity 38C Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-parity-38c-register.yml
      - content-authoring/cnple/cram/38c-lab-liver-inflammation-endocrine-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_38C.md

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-labs-38c-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-labs-38c-20260808
          fetch-depth: 0
      - name: Validate and register 38C
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('content-authoring/cnple/cram')
          manifest_path = root/'manifest.json'
          m = json.loads(manifest_path.read_text())
          predecessor = (418, 418, 410, 41)
          registered = (426, 426, 418, 42)
          got = (m['rawLessonObjects'], m['uniqueLessonIds'], m['canonicalTopicPathways'], m['clinicalJsonFiles'])
          if got not in (predecessor, registered):
              raise SystemExit(f'refusing: unexpected manifest state {got}')

          path = '38c-lab-liver-inflammation-endocrine-parity.json'
          rows = json.loads((root/path).read_text())
          expected_ids = [
            'lab-ast-and-alt','lab-bilirubin-and-jaundice','lab-liver-function-patterns','lab-crp',
            'lab-esr','lab-procalcitonin','lab-thyroid-function-tests','lab-glucose-interpretation'
          ]
          ids = [r.get('id') for r in rows]
          if ids != expected_ids:
              raise SystemExit(f'refusing: 38C ids {ids} != {expected_ids}')
          if len(ids) != len(set(ids)):
              raise SystemExit('refusing: duplicate ids inside 38C')
          required = ['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          for r in rows:
              missing = [k for k in required if k not in r]
              if missing:
                  raise SystemExit(f"{r.get('id')}: missing {missing}")

          if got == predecessor:
              m['rawLessonObjects'] = 426
              m['uniqueLessonIds'] = 426
              m['canonicalTopicPathways'] = 418
              m['clinicalJsonFiles'] = 42
              m['files'].append({'path': path, 'lessons': 8, 'role': 'full_lesson_parity_expansion'})
              m['auditDocuments'].append('AUTHORING_QA_PARITY_38C.md')
              m['fullLessonParity']['authoringCanonicalTopicPathways'] = 418
              pub = m['publication']
              pub['secondPassClinicalAuditCompleteForParity38C'] = True
              pub['newExpansionBatchPendingSecondPassAudit'] = False
              pub['note'] = 'The 426-object library is an audited topic baseline plus active Full-lesson parity expansions. Batches 37, 38A, 38B and 38C have passed clinical second-pass review; private-core identity/source/Quick-Check/runtime certification remains fail-closed and Full-lesson parity is not complete.'
          else:
              matches = [f for f in m['files'] if f.get('path') == path]
              if matches != [{'path': path, 'lessons': 8, 'role': 'full_lesson_parity_expansion'}]:
                  raise SystemExit(f'refusing: registered 38C file entry invalid: {matches}')
              if m['auditDocuments'].count('AUTHORING_QA_PARITY_38C.md') != 1:
                  raise SystemExit('refusing: 38C audit registration is not exactly once')
              if m['fullLessonParity']['authoringCanonicalTopicPathways'] != 418:
                  raise SystemExit('refusing: registered parity pathway count drift')
              if m['publication'].get('secondPassClinicalAuditCompleteForParity38C') is not True:
                  raise SystemExit('refusing: 38C clinical audit flag missing')

          all_ids=[]
          total=0
          for f in m['files']:
              data=json.loads((root/f['path']).read_text())
              if len(data) != f['lessons']:
                  raise SystemExit(f"{f['path']}: {len(data)} != {f['lessons']}")
              total += len(data)
              all_ids.extend(r['id'] for r in data)
          if total != 426 or len(all_ids) != 426 or len(set(all_ids)) != 426:
              raise SystemExit(f'global validation failed total={total} ids={len(all_ids)} unique={len(set(all_ids))}')
          manifest_path.write_text(json.dumps(m, indent=2, ensure_ascii=False)+'\n')
          PY
          git diff --check -- content-authoring/cnple/cram/manifest.json
      - name: Commit registered manifest and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-parity-38c-register.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/38c-lab-liver-inflammation-endocrine-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_38C.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): finalize audited parity batch 38C registration'
          git push origin HEAD:content/cnple-cram-parity-labs-38c-20260808
