name: CNPLE Parity 42C Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - content-authoring/cnple/cram/42c-professional-ethics-equity-evidence-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_42C.md
      - .github/workflows/cnple-cram-parity-42c-register.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-professional-42c-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-professional-42c-20260809
          fetch-depth: 0
      - name: Sync validated 42B predecessor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin content/cnple-cram-parity-professional-42b-20260809
          git merge --no-edit origin/content/cnple-cram-parity-professional-42b-20260809
      - name: Validate and register 42C
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const root='content-authoring/cnple/cram'; const mp=`${root}/manifest.json`; const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.rawLessonObjects!==515||m.uniqueLessonIds!==515||m.canonicalTopicPathways!==507||m.clinicalJsonFiles!==54) throw new Error(`unexpected predecessor ${m.rawLessonObjects}/${m.uniqueLessonIds}/${m.canonicalTopicPathways}/${m.clinicalJsonFiles}`);
          const batch='42c-professional-ethics-equity-evidence-parity.json'; if(m.files.some(f=>f.path===batch)) throw new Error('42C already registered');
          const rows=JSON.parse(fs.readFileSync(`${root}/${batch}`,'utf8'));
          const expected=['np-ethical-decision-making','np-cultural-competence-in-practice','np-health-equity-and-social-determinants','np-interprofessional-collaboration','np-leadership-in-healthcare','np-quality-and-safety-improvement','np-evidence-based-practice','np-continuing-education-requirements'];
          if(rows.length!==8||rows.map(r=>r.id).join('|')!==expected.join('|')) throw new Error('42C identity mismatch');
          const req=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck'];
          for(const r of rows) for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);
          m.files.push({path:batch,lessons:8,role:'full_lesson_parity_expansion'}); m.rawLessonObjects=523; m.uniqueLessonIds=523; m.canonicalTopicPathways=515; m.clinicalJsonFiles=55; m.sourceRefreshDate='2026-08-09'; m.auditDocuments=[...new Set([...(m.auditDocuments||[]),'AUTHORING_QA_PARITY_42C.md'])]; m.fullLessonParity={...m.fullLessonParity,status:'IN_PROGRESS',authoringCanonicalTopicPathways:515}; m.publication={...m.publication,fullLessonCramParityComplete:false,secondPassClinicalAuditCompleteForParity42C:true,newExpansionBatchPendingSecondPassAudit:false,rendererMappingComplete:false,productionMerged:false,productionDeployed:false}; fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
          const ids=new Set(); let total=0; for(const f of m.files){const data=JSON.parse(fs.readFileSync(`${root}/${f.path}`,'utf8')); if(!Array.isArray(data)||data.length!==f.lessons) throw new Error(`count mismatch ${f.path}`); total+=data.length; for(const r of data){if(!r.id||ids.has(r.id)) throw new Error(`duplicate/missing id ${r.id}`); ids.add(r.id); for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);}}
          if(total!==523||ids.size!==523) throw new Error(`global mismatch ${total}/${ids.size}`);
          NODE
      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cnple-cram-parity-42c-register.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/42c-professional-ethics-equity-evidence-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_42C.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): register professional parity batch 42C'
          git push origin HEAD:content/cnple-cram-parity-professional-42c-20260809
