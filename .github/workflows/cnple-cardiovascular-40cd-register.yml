name: CNPLE Cardiovascular 40C-D Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "content-authoring/cnple/cram/40c-cardiovascular-core-decisions-parity.json"
      - "content-authoring/cnple/cram/40d-cardiovascular-diagnostics-devices-parity.json"
      - "content-authoring/cnple/cram/AUTHORING_QA_PARITY_40C.md"
      - "content-authoring/cnple/cram/AUTHORING_QA_PARITY_40D.md"
      - ".github/workflows/cnple-cardiovascular-40cd-register.yml"

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-cardiovascular-40d-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-cardiovascular-40d-20260809
          fetch-depth: 0
      - name: Register and validate 40C-D
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          p=root/'manifest.json'
          m=json.loads(p.read_text())
          assert m['rawLessonObjects']==483, m['rawLessonObjects']
          assert m['uniqueLessonIds']==483
          assert m['canonicalTopicPathways']==475
          assert m['clinicalJsonFiles']==50
          additions=[
            ('40c-cardiovascular-core-decisions-parity.json',6,'AUTHORING_QA_PARITY_40C.md'),
            ('40d-cardiovascular-diagnostics-devices-parity.json',6,'AUTHORING_QA_PARITY_40D.md'),
          ]
          existing={f['path'] for f in m['files']}
          for path,count,qa in additions:
            rows=json.loads((root/path).read_text())
            assert isinstance(rows,list) and len(rows)==count,(path,len(rows))
            if path not in existing:
              m['files'].append({'path':path,'lessons':count,'role':'full_lesson_parity_expansion'})
            if qa not in m['auditDocuments']:
              m['auditDocuments'].append(qa)
          m['rawLessonObjects']=495
          m['uniqueLessonIds']=495
          m['canonicalTopicPathways']=487
          m['clinicalJsonFiles']=52
          m['sourceRefreshDate']='2026-08-09'
          m['fullLessonParity']['authoringCanonicalTopicPathways']=487
          pub=m['publication']
          pub['secondPassClinicalAuditCompleteForParity40C']=True
          pub['secondPassClinicalAuditCompleteForParity40D']=True
          pub['newExpansionBatchPendingSecondPassAudit']=False
          pub['note']='The 495-object CNPLE Cram V2 estate includes the completed exact-identity cardiovascular parity family through 40D. Full-lesson parity is still incomplete; private-core identity/source/Quick-Check/runtime certification remains required.'
          p.write_text(json.dumps(m,indent=2)+'\n')

          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          ids=set(); total=0
          for f in m['files']:
            rows=json.loads((root/f['path']).read_text())
            assert len(rows)==f['lessons'],(f['path'],len(rows),f['lessons'])
            for r in rows:
              total+=1
              missing=[k for k in required if k not in r]
              assert not missing,(r.get('id'),missing)
              assert r['id'] not in ids,('duplicate',r['id'])
              ids.add(r['id'])
          assert total==495,total
          assert len(ids)==495,len(ids)
          assert len(m['files'])==52,len(m['files'])
          assert m['canonicalTopicPathways']==m['uniqueLessonIds']-m['explicitCanonicalSupersessions']
          PY
          git diff --check -- content-authoring/cnple/cram/manifest.json
      - name: Commit governed manifest registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-cardiovascular-40cd-register.yml
          git add content-authoring/cnple/cram/manifest.json
          git diff --cached --check
          git commit -m 'content(cnple-cram): register cardiovascular parity 40C-D'
          git push origin HEAD:content/cnple-cram-parity-cardiovascular-40d-20260809
