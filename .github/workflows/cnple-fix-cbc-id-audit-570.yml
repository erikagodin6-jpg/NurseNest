name: CNPLE Fix CBC Identity and Audit 570

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-fix-cbc-id-audit-570.yml

permissions:
  contents: write

jobs:
  fix-audit:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-consolidate-renal-derm-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-consolidate-renal-derm-20260809
          fetch-depth: 0
      - name: Correct canonical CBC identity and validate 570 estate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          cbc=root/'38d-lab-cbc-electrolyte-acid-base-parity.json'
          rows=json.loads(cbc.read_text())
          old=[r for r in rows if r.get('id')=='lab-cbc-interpretation']
          new=[r for r in rows if r.get('id')=='lab-complete-blood-count']
          if len(old)==1 and not new:
              old[0]['id']='lab-complete-blood-count'
              cbc.write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          elif not old and len(new)==1:
              pass
          else:
              raise SystemExit(f'CBC identity state unexpected old={len(old)} new={len(new)}')

          qa=root/'AUTHORING_QA_PARITY_38D.md'
          text=qa.read_text()
          text=text.replace('- `lab-cbc-interpretation`','- `lab-complete-blood-count`')
          text=text.replace('All IDs are the literal slugs generated by the canonical shared Lab Interpretation curriculum generator.','All IDs now match the literal slugs generated by the canonical shared Lab Interpretation curriculum generator. The CBC identity was corrected during the global parity audit from the earlier authoring alias `lab-cbc-interpretation` to canonical `lab-complete-blood-count`; clinical content was unchanged.')
          qa.write_text(text)

          m=json.loads((root/'manifest.json').read_text())
          expected=(570,570,562,60)
          got=(m['rawLessonObjects'],m['uniqueLessonIds'],m['canonicalTopicPathways'],m['clinicalJsonFiles'])
          if got!=expected: raise SystemExit(f'manifest {got} != {expected}')
          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          ids=[]; total=0
          for f in m['files']:
              data=json.loads((root/f['path']).read_text())
              if len(data)!=f['lessons']: raise SystemExit(f"{f['path']}: {len(data)} != {f['lessons']}")
              for r in data:
                  miss=[k for k in required if k not in r]
                  if miss: raise SystemExit(f"{r.get('id')}: missing {miss}")
                  ids.append(r['id'])
              total+=len(data)
          if total!=570 or len(ids)!=570 or len(set(ids))!=570:
              raise SystemExit(f'global total/id failure {total}/{len(ids)}/{len(set(ids))}')
          def slugify(x): return re.sub(r'^-|-$','',re.sub(r'[^a-z0-9]+','-',x.lower()))[:72]
          lab_titles=[
            'Complete Blood Count','Hemoglobin and Hematocrit','White Blood Cells and Differential','Platelets and Coagulation Basics','Sodium Disorders','Potassium Disorders','Calcium Disorders','Magnesium Disorders','Phosphate Disorders','BUN and Creatinine','eGFR and Renal Function','Acute Kidney Injury Lab Trends','AST and ALT','Bilirubin and Jaundice','Liver Function Patterns','Glucose Interpretation','A1C Interpretation','Thyroid Function Tests','Troponin','BNP and Heart Failure','CK and CK-MB','CRP','ESR','Procalcitonin','Lactate','PT and INR','aPTT','D-Dimer','ABG Fundamentals','Respiratory Acidosis','Respiratory Alkalosis','Metabolic Acidosis','Metabolic Alkalosis','Mixed Disorders','Sepsis Lab Recognition','DKA Lab Patterns','GI Bleed Lab Trends','Heart Failure Lab Patterns','Shock Lab Patterns','Multi-Lab Clinical Judgment'
          ]
          expected_lab={f'lab-{slugify(x)}' for x in lab_titles}
          actual_lab={x for x in ids if x.startswith('lab-')}
          if actual_lab!=expected_lab:
              raise SystemExit(f'lab parity mismatch missing={sorted(expected_lab-actual_lab)} extra={sorted(actual_lab-expected_lab)}')

          renal=[
            'chronic kidney disease staging and management','acute kidney injury recognition and workup','proteinuria evaluation and management','hematuria workup and differential diagnosis','urinary tract infection diagnosis and management','pyelonephritis diagnosis and treatment','nephrolithiasis evaluation and prevention','glomerulonephritis recognition and referral','diabetic nephropathy prevention and management','hypertensive nephrosclerosis management','electrolyte management in CKD','anemia of CKD evaluation and treatment','mineral bone disorder in CKD','dialysis indications and preparation','kidney transplant follow up basics','drug dosing in renal impairment','benign prostatic hyperplasia management','urinary incontinence evaluation and treatment','overactive bladder management','erectile dysfunction evaluation and treatment','prostatitis diagnosis and management','testicular disorders evaluation','renal imaging interpretation','urinalysis in renal disease','acid base disorders evaluation'
          ]
          derm=[
            'acne vulgaris diagnosis and treatment','rosacea diagnosis and management','atopic dermatitis management','contact dermatitis evaluation and management','psoriasis diagnosis and treatment','seborrheic dermatitis management','bacterial skin infections management','viral skin infections diagnosis and treatment','fungal skin infections diagnosis and treatment','skin cancer screening and recognition','melanoma recognition and referral','basal cell carcinoma management','squamous cell carcinoma management','actinic keratosis treatment','pigmented lesion evaluation','urticaria and angioedema management','drug eruptions recognition and management','autoimmune blistering disorders recognition','skin biopsy techniques and indications','cryotherapy and electrosurgery basics','wound care and healing principles','leg ulcer evaluation and management','hidradenitis suppurativa management','hair loss evaluation and treatment','nail disorders diagnosis','pediatric dermatology common conditions'
          ]
          expected_renal={f'np-{slugify(x)}' for x in renal}; expected_derm={f'np-{slugify(x)}' for x in derm}
          actual_renal=set(); actual_derm=set()
          for fn in ['42a-renal-core-parity.json','43a-renal-chronic-management-parity.json','43b-renal-urology-completion-parity.json']:
              actual_renal.update(r['id'] for r in json.loads((root/fn).read_text()))
          for fn in ['44a-dermatology-inflammatory-infectious-parity.json','44b-dermatology-cancer-allergy-emergency-parity.json','44c-dermatology-procedures-wounds-hair-nail-peds-parity.json']:
              actual_derm.update(r['id'] for r in json.loads((root/fn).read_text()))
          if actual_renal!=expected_renal: raise SystemExit(f'renal parity mismatch missing={sorted(expected_renal-actual_renal)} extra={sorted(actual_renal-expected_renal)}')
          if actual_derm!=expected_derm: raise SystemExit(f'derm parity mismatch missing={sorted(expected_derm-actual_derm)} extra={sorted(actual_derm-expected_derm)}')

          report={'schemaVersion':2,'validatedAt':'2026-08-09','status':'PASS','rawLessonObjects':570,'uniqueLessonIds':570,'canonicalTopicPathways':562,'clinicalJsonFiles':60,'identityCorrections':{'lab-cbc-interpretation':'lab-complete-blood-count'},'exactGeneratorParity':{'labInterpretation':40,'renalUrology':25,'dermatology':26},'globalJsonParse':True,'requiredFieldsValidated':True,'globalIdUniqueness':True}
          (root/'AUTHORING_GLOBAL_AUDIT_570_V2.json').write_text(json.dumps(report,indent=2)+'\n')
          m['structuralValidation']={'status':'PASS','jsonParse':True,'requiredFields':True,'uniqueIds':True,'duplicateIdCount':0,'canadianContaminationScan':m.get('structuralValidation',{}).get('canadianContaminationScan','PASS'),'validatedAt':'2026-08-09'}
          if 'AUTHORING_GLOBAL_AUDIT_570_V2.json' not in m['auditDocuments']: m['auditDocuments'].append('AUTHORING_GLOBAL_AUDIT_570_V2.json')
          m['publication']['note']='The 570-object library has passed fresh global JSON/required-field/ID validation after correcting the CBC Cram identity to canonical lab-complete-blood-count. Exact generator parity is proven for Lab Interpretation (40/40), Renal/Urology (25/25), and Dermatology (26/26). Full CNPLE curriculum parity and downstream private-core certification remain incomplete.'
          (root/'manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --check -- content-authoring/cnple/cram/38d-lab-cbc-electrolyte-acid-base-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_38D.md content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/AUTHORING_GLOBAL_AUDIT_570_V2.json
      - name: Commit correction and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE audit'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-fix-cbc-id-audit-570.yml
          git add content-authoring/cnple/cram/38d-lab-cbc-electrolyte-acid-base-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_38D.md content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/AUTHORING_GLOBAL_AUDIT_570_V2.json
          git diff --cached --check
          git commit -m 'fix(cnple-cram): align CBC identity and certify 570 estate'
          git push origin HEAD:content/cnple-cram-parity-consolidate-renal-derm-20260809
