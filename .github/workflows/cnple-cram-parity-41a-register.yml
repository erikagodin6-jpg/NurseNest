name: CNPLE Parity 41A Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - content-authoring/cnple/cram/41a-diagnostics-imaging-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_41A.md
      - .github/workflows/cnple-cram-parity-41a-register.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-diagnostics-41a-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-diagnostics-41a-20260809
          fetch-depth: 0
      - name: Sync validated 40B predecessor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin content/cnple-cram-parity-cardiovascular-40b-20260809
          git merge --no-edit origin/content/cnple-cram-parity-cardiovascular-40b-20260809
      - name: Validate and register 41A
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const root='content-authoring/cnple/cram'; const mp=`${root}/manifest.json`; const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.rawLessonObjects!==483||m.uniqueLessonIds!==483||m.canonicalTopicPathways!==475||m.clinicalJsonFiles!==50) throw new Error(`unexpected predecessor ${m.rawLessonObjects}/${m.uniqueLessonIds}/${m.canonicalTopicPathways}/${m.clinicalJsonFiles}`);
          const batch='41a-diagnostics-imaging-parity.json'; if(m.files.some(f=>f.path===batch)) throw new Error('41A already registered');
          const rows=JSON.parse(fs.readFileSync(`${root}/${batch}`,'utf8'));
          const expected=['np-ecg-interpretation-fundamentals','np-chest-x-ray-interpretation','np-abdominal-imaging-selection','np-musculoskeletal-imaging-selection','np-neuroimaging-indications-and-interpretation','np-ultrasound-in-primary-care','np-ct-indications-and-contraindications','np-mri-indications-and-contraindications'];
          if(rows.length!==8||rows.map(r=>r.id).join('|')!==expected.join('|')) throw new Error('41A identity mismatch');
          const req=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck'];
          for(const r of rows) for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);
          m.files.push({path:batch,lessons:8,role:'full_lesson_parity_expansion'}); m.rawLessonObjects=491; m.uniqueLessonIds=491; m.canonicalTopicPathways=483; m.clinicalJsonFiles=51; m.sourceRefreshDate='2026-08-09'; m.auditDocuments=[...new Set([...(m.auditDocuments||[]),'AUTHORING_QA_PARITY_41A.md'])]; m.fullLessonParity={...m.fullLessonParity,status:'IN_PROGRESS',authoringCanonicalTopicPathways:483}; m.publication={...m.publication,fullLessonCramParityComplete:false,secondPassClinicalAuditCompleteForParity41A:true,newExpansionBatchPendingSecondPassAudit:false,rendererMappingComplete:false,productionMerged:false,productionDeployed:false}; fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
          const ids=new Set(); let total=0; for(const f of m.files){const data=JSON.parse(fs.readFileSync(`${root}/${f.path}`,'utf8')); if(!Array.isArray(data)||data.length!==f.lessons) throw new Error(`count mismatch ${f.path}`); total+=data.length; for(const r of data){if(!r.id||ids.has(r.id)) throw new Error(`duplicate/missing id ${r.id}`); ids.add(r.id); for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);}}
          if(total!==491||ids.size!==491) throw new Error(`global mismatch ${total}/${ids.size}`);
          NODE
      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cnple-cram-parity-41a-register.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/41a-diagnostics-imaging-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_41A.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): register diagnostics imaging parity batch 41A'
          git push origin HEAD:content/cnple-cram-parity-diagnostics-41a-20260809
