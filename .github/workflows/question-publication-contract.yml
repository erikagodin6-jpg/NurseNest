name: Question Publication Contract

on:
  pull_request:
    paths:
      - 'server/**'
      - 'script/**'
      - 'scripts/**'
      - 'client/src/**'
      - 'migrations/**'
      - 'shared/**'
      - '.github/workflows/question-publication-contract.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'script/**'
      - 'scripts/**'
      - 'client/src/**'
      - 'migrations/**'
      - 'shared/**'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Canonical contract tests
        run: npx vitest run server/question-publication-contract.test.ts server/question-authoring-normalizer.test.ts server/question-serving-contract.test.ts server/question-unit-conversion.test.ts server/question-interaction-contract.test.ts client/src/lib/legacy-question-contract.test.ts
      - name: Full authored-source debt report
        run: npx tsx script/audit-authored-question-contract-v2.ts > question-contract-source-audit.json
      - name: Active question schema family inventory
        run: npx tsx script/audit-active-question-schema-families.ts > question-schema-families.json
      - name: Active interaction mode inventory
        shell: bash
        run: |
          set +e
          npx tsx script/audit-active-question-interaction-modes.ts > question-interaction-modes.json
          echo $? > /tmp/interaction-audit-code
          cat question-interaction-modes.json | head -c 12000
          exit "$(cat /tmp/interaction-audit-code)"
      - name: Template content audit
        shell: bash
        run: |
          set +e
          npx tsx script/audit-active-question-template-content.ts > question-template-content.json
          echo $? > /tmp/template-audit-code
          cat question-template-content.json | head -c 12000
          exit "$(cat /tmp/template-audit-code)"
      - name: Quarantine replacement audit
        run: npx tsx script/audit-question-source-quarantine.ts > question-quarantine-audit.json
      - name: Career question contract debt report
        shell: bash
        run: |
          set +e
          npx tsx script/audit-career-question-contract-v2.ts > career-question-contract.json
          code=$?
          cat career-question-contract.json | head -c 12000
          echo "career_contract_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Career quarantine topic parity
        shell: bash
        run: |
          npx tsx script/audit-career-quarantine-topic-parity.ts > career-topic-parity.json
          cat career-topic-parity.json | head -c 16000
      - name: Show source audit summary
        if: always()
        run: |
          cat question-contract-source-audit.json | head -c 7000 || true
          echo
          cat question-schema-families.json | head -c 7000 || true
          echo
          cat question-interaction-modes.json | head -c 7000 || true
          echo
          cat question-template-content.json | head -c 7000 || true
          echo
          cat question-quarantine-audit.json | head -c 7000 || true
          echo
          cat career-question-contract.json | head -c 10000 || true
          echo
          cat career-topic-parity.json | head -c 12000 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: question-contract-source-audit
          path: |
            question-contract-source-audit.json
            question-schema-families.json
            question-interaction-modes.json
            question-template-content.json
            question-quarantine-audit.json
            career-question-contract.json
            career-topic-parity.json
          retention-days: 14

  changed-question-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject newly introduced positional question contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=0 "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            'server/content/**/*.ts' 'server/content/**/*.tsx' 'script/**/*.ts' 'scripts/**/*.ts' 'scripts/**/*.cjs' \
            'client/src/data/**/*.ts' 'client/src/data/**/*.tsx' 'client/src/pages/international-nurses/data.ts' > /tmp/question.diff || true

          added=$(grep '^+' /tmp/question.diff | grep -v '^+++' || true)
          bad=0
          if printf '%s\n' "$added" | grep -Eq 'correct(Index|Indices)[[:space:]]*:'; then echo 'New positional correctIndex/correctIndices contract detected in authored question data. Normalize to stable option IDs before persistence.'; bad=1; fi
          if printf '%s\n' "$added" | grep -Eq 'distractorRationales[[:space:]]*:[[:space:]]*\{[[:space:]]*["'"']?[0-9ABCD]["'"']?[[:space:]]*:'; then echo 'New position/label-keyed distractor rationales detected in authored content. Use stable option IDs.'; bad=1; fi
          if printf '%s\n' "$added" | grep -Eq 'options[[:space:]]*:[[:space:]]*\[[[:space:]]*["'"']'; then echo 'New primitive string option array detected in authored question content. Normalize options to {id,text,label}.'; bad=1; fi
          exit "$bad"
