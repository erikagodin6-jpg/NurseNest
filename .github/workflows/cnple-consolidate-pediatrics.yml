name: CNPLE Consolidate Pediatrics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "content-authoring/cnple/cram/49a-pediatrics-parity.json"
      - "content-authoring/cnple/cram/49b-pediatrics-parity.json"
      - "content-authoring/cnple/cram/AUTHORING_QA_PEDIATRICS_49.md"
      - ".github/workflows/cnple-consolidate-pediatrics.yml"

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-pediatrics-49a-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-pediatrics-49a-20260810
          fetch-depth: 0

      - name: Merge successful Women's Health parent
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin content/cnple-cram-parity-consolidated-womens-health-20260810
          git merge --no-edit origin/content/cnple-cram-parity-consolidated-womens-health-20260810
          test -f content-authoring/cnple/cram/AUTHORING_CONSOLIDATION_WOMENS_HEALTH.json
          python3 - <<'PY'
          import json
          p='content-authoring/cnple/cram/AUTHORING_CONSOLIDATION_WOMENS_HEALTH.json'
          d=json.load(open(p))
          assert d['canonicalWomenHealthDenominator']==26
          assert d['publication']['authoringParityCompleteForWomensHealthGenerator'] is True
          PY

      - name: Consolidate literal 26-ID Pediatrics denominator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          mp=root/'manifest.json'; m=json.loads(mp.read_text())
          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          concepts=[
            'well child care and anticipatory guidance','immunization schedule and catch up','newborn care and screening','infant feeding and nutrition','childhood growth and development','developmental surveillance and screening','autism spectrum disorder screening','ADHD diagnosis and management','childhood asthma diagnosis and management','pediatric respiratory infections','pediatric gastrointestinal disorders','pediatric skin conditions','childhood fever evaluation','pediatric otitis media management','pediatric pharyngitis evaluation','childhood exanthems recognition','pediatric cardiac murmurs evaluation','pediatric orthopedic conditions','adolescent health and confidentiality','pediatric mental health screening','child abuse recognition and reporting','pediatric toxicology common exposures','pediatric allergic conditions','pediatric endocrine disorders','pediatric neurologic conditions','pediatric urgent care triage']
          def slug(s): return re.sub(r'(^-|-$)','',re.sub(r'[^a-z0-9]+','-',s.lower()))[:72]
          target=['np-'+slug(x) for x in concepts]
          if len(target)!=26 or len(set(target))!=26: raise SystemExit('bad_peds_denominator')
          source=json.loads((root/'49a-pediatrics-parity.json').read_text())+json.loads((root/'49b-pediatrics-parity.json').read_text())
          sb={x['id']:x for x in source}
          if set(sb)!=set(target): raise SystemExit(f'peds_source_mismatch missing={sorted(set(target)-set(sb))} extra={sorted(set(sb)-set(target))}')
          existing={}; final_count=0
          for item in m['files']:
            rows=json.loads((root/item['path']).read_text())
            if len(rows)!=item['lessons']: raise SystemExit('manifest_count:'+item['path'])
            final_count+=len(rows)
            for r in rows:
              for k in required:
                if k not in r: raise SystemExit(f'missing:{r.get("id")}:{k}')
              if r['id'] in existing: raise SystemExit('dup_before:'+r['id'])
              existing[r['id']]=r
          conflicts=[]; already=[]; add=[]
          for rid in target:
            if rid in existing:
              if existing[rid]!=sb[rid]: conflicts.append(rid)
              else: already.append(rid)
            else: add.append(sb[rid])
          if conflicts:
            (root/'AUTHORING_PEDIATRICS_CONFLICTS.json').write_text(json.dumps({'conflicts':conflicts},indent=2)+'\n')
            raise SystemExit('same_id_different_content:'+','.join(conflicts))
          out='50-pediatrics-generator-parity.json'
          (root/out).write_text(json.dumps(add,indent=2,ensure_ascii=False)+'\n')
          (root/'49a-pediatrics-parity.json').unlink(); (root/'49b-pediatrics-parity.json').unlink()
          if add: m['files'].append({'path':out,'lessons':len(add),'role':'full_lesson_parity_expansion'})
          audits=m.setdefault('auditDocuments',[])
          if 'AUTHORING_QA_PEDIATRICS_49.md' not in audits: audits.append('AUTHORING_QA_PEDIATRICS_49.md')
          m['rawLessonObjects']+=len(add); m['uniqueLessonIds']+=len(add); m['canonicalTopicPathways']+=len(add); m['clinicalJsonFiles']+=(1 if add else 0)
          m['sourceRefreshDate']='2026-08-10'; m['structuralValidation']['validatedAt']='2026-08-10'; m['fullLessonParity']['authoringCanonicalTopicPathways']=m['canonicalTopicPathways']; m['publication']['fullLessonCramParityComplete']=False
          # final global validation
          ids=set(); count=0
          for item in m['files']:
            rows=json.loads((root/item['path']).read_text())
            if len(rows)!=item['lessons']: raise SystemExit('final_count:'+item['path'])
            count+=len(rows)
            for r in rows:
              for k in required:
                if k not in r: raise SystemExit(f'final_missing:{r.get("id")}:{k}')
              if r['id'] in ids: raise SystemExit('final_dup:'+r['id'])
              ids.add(r['id'])
          if count!=m['rawLessonObjects'] or len(ids)!=m['uniqueLessonIds']: raise SystemExit('manifest_arithmetic')
          if m['rawLessonObjects']-m.get('explicitCanonicalSupersessions',0)!=m['canonicalTopicPathways']: raise SystemExit('canonical_arithmetic')
          if not set(target).issubset(ids): raise SystemExit('peds_26_not_complete')
          ledger={'schemaVersion':1,'generatedAt':'2026-08-10','canonicalPediatricsDenominator':26,'targetIds':target,'alreadyPresentExact':already,'newlyImported':[x['id'] for x in add],'newlyImportedCount':len(add),'finalManifest':{'rawLessonObjects':m['rawLessonObjects'],'uniqueLessonIds':m['uniqueLessonIds'],'canonicalTopicPathways':m['canonicalTopicPathways'],'clinicalJsonFiles':m['clinicalJsonFiles']},'publication':{'authoringParityCompleteForPediatricsGenerator':True,'runtimeCertified':False}}
          (root/'AUTHORING_CONSOLIDATION_PEDIATRICS.json').write_text(json.dumps(ledger,indent=2)+'\n'); mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n'); print(json.dumps(ledger,indent=2))
          PY

      - name: Commit governed Pediatrics consolidation
        run: |
          set -euo pipefail
          git rm .github/workflows/cnple-consolidate-pediatrics.yml
          git add content-authoring/cnple/cram
          git diff --cached --check
          git commit -m 'content(cnple-cram): consolidate complete pediatrics parity'
          git push origin HEAD:content/cnple-cram-parity-pediatrics-49a-20260810
