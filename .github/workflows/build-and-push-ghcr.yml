name: Build GHCR Deploy DigitalOcean disabled

# Disabled intentionally.
# DigitalOcean serves ghcr.io/erikagodin6-jpg/nursenest:latest.
# That image is now built from erikagodin6-jpg/nursenest-core instead.
# This older repository must not overwrite the live latest image.

on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: "Disabled. Use erikagodin6-jpg/nursenest-core instead."
        required: true
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment source moved
        run: echo "This workflow is disabled. Build and deploy from erikagodin6-jpg/nursenest-core instead."
