name: CNPLE V2 570 Global Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-v2-570-global-audit.yml
      - content-authoring/cnple/cram/**

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-consolidate-renal-derm-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-consolidate-renal-derm-20260809
          fetch-depth: 0
      - name: Validate 570-object estate and generator parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          m=json.loads((root/'manifest.json').read_text())
          expected=(570,570,562,60)
          got=(m['rawLessonObjects'],m['uniqueLessonIds'],m['canonicalTopicPathways'],m['clinicalJsonFiles'])
          if got!=expected: raise SystemExit(f'manifest {got} != {expected}')
          if len(m['files'])!=60: raise SystemExit(f'files {len(m["files"])} != 60')
          if m['rawLessonObjects']-m['explicitCanonicalSupersessions']!=m['canonicalTopicPathways']:
              raise SystemExit('canonical arithmetic drift')
          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          ids=[]; total=0
          for f in m['files']:
              data=json.loads((root/f['path']).read_text())
              if len(data)!=f['lessons']: raise SystemExit(f"{f['path']}: {len(data)} != {f['lessons']}")
              for r in data:
                  miss=[k for k in required if k not in r]
                  if miss: raise SystemExit(f"{r.get('id')}: missing {miss}")
                  ids.append(r['id'])
              total += len(data)
          if total!=570 or len(ids)!=570 or len(set(ids))!=570:
              raise SystemExit(f'global total/id failure {total}/{len(ids)}/{len(set(ids))}')
          def slugify(x): return re.sub(r'^-|-$','',re.sub(r'[^a-z0-9]+','-',x.lower()))[:72]
          renal=[
            'chronic kidney disease staging and management','acute kidney injury recognition and workup','proteinuria evaluation and management','hematuria workup and differential diagnosis','urinary tract infection diagnosis and management','pyelonephritis diagnosis and treatment','nephrolithiasis evaluation and prevention','glomerulonephritis recognition and referral','diabetic nephropathy prevention and management','hypertensive nephrosclerosis management','electrolyte management in CKD','anemia of CKD evaluation and treatment','mineral bone disorder in CKD','dialysis indications and preparation','kidney transplant follow up basics','drug dosing in renal impairment','benign prostatic hyperplasia management','urinary incontinence evaluation and treatment','overactive bladder management','erectile dysfunction evaluation and treatment','prostatitis diagnosis and management','testicular disorders evaluation','renal imaging interpretation','urinalysis in renal disease','acid base disorders evaluation'
          ]
          derm=[
            'acne vulgaris diagnosis and treatment','rosacea diagnosis and management','atopic dermatitis management','contact dermatitis evaluation and management','psoriasis diagnosis and treatment','seborrheic dermatitis management','bacterial skin infections management','viral skin infections diagnosis and treatment','fungal skin infections diagnosis and treatment','skin cancer screening and recognition','melanoma recognition and referral','basal cell carcinoma management','squamous cell carcinoma management','actinic keratosis treatment','pigmented lesion evaluation','urticaria and angioedema management','drug eruptions recognition and management','autoimmune blistering disorders recognition','skin biopsy techniques and indications','cryotherapy and electrosurgery basics','wound care and healing principles','leg ulcer evaluation and management','hidradenitis suppurativa management','hair loss evaluation and treatment','nail disorders diagnosis','pediatric dermatology common conditions'
          ]
          expected_renal={f'np-{slugify(x)}' for x in renal}
          expected_derm={f'np-{slugify(x)}' for x in derm}
          actual_renal=set(); actual_derm=set()
          for fn in ['42a-renal-core-parity.json','43a-renal-chronic-management-parity.json','43b-renal-urology-completion-parity.json']:
              actual_renal.update(r['id'] for r in json.loads((root/fn).read_text()))
          for fn in ['44a-dermatology-inflammatory-infectious-parity.json','44b-dermatology-cancer-allergy-emergency-parity.json','44c-dermatology-procedures-wounds-hair-nail-peds-parity.json']:
              actual_derm.update(r['id'] for r in json.loads((root/fn).read_text()))
          if actual_renal!=expected_renal:
              raise SystemExit(f'renal mismatch missing={sorted(expected_renal-actual_renal)} extra={sorted(actual_renal-expected_renal)}')
          if actual_derm!=expected_derm:
              raise SystemExit(f'derm mismatch missing={sorted(expected_derm-actual_derm)} extra={sorted(actual_derm-expected_derm)}')
          report={'schemaVersion':1,'validatedAt':'2026-08-09','status':'PASS','rawLessonObjects':570,'uniqueLessonIds':570,'canonicalTopicPathways':562,'clinicalJsonFiles':60,'exactGeneratorParity':{'renalUrology':25,'dermatology':26},'globalJsonParse':True,'requiredFieldsValidated':True,'globalIdUniqueness':True}
          (root/'AUTHORING_GLOBAL_AUDIT_570.json').write_text(json.dumps(report,indent=2)+'\n')
          m['structuralValidation']={'status':'PASS','jsonParse':True,'requiredFields':True,'uniqueIds':True,'duplicateIdCount':0,'canadianContaminationScan':m.get('structuralValidation',{}).get('canadianContaminationScan','PASS'),'validatedAt':'2026-08-09'}
          if 'AUTHORING_GLOBAL_AUDIT_570.json' not in m['auditDocuments']: m['auditDocuments'].append('AUTHORING_GLOBAL_AUDIT_570.json')
          m['publication']['note']='The 570-object library has passed fresh global JSON/required-field/ID validation and exact generator parity for Renal/Urology (25/25) and Dermatology (26/26). Full CNPLE curriculum parity and downstream private-core certification remain incomplete.'
          (root/'manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --check -- content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/AUTHORING_GLOBAL_AUDIT_570.json
      - name: Persist audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE audit'
          git config user.email 'actions@users.noreply.github.com'
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/AUTHORING_GLOBAL_AUDIT_570.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit(cnple-cram): certify 570-object renal dermatology estate'
            git push origin HEAD:content/cnple-cram-parity-consolidate-renal-derm-20260809
          fi
