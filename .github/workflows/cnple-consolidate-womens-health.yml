name: CNPLE Consolidate Women's Health

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "content-authoring/cnple/cram/47-womens-health-completion.json"
      - ".github/workflows/cnple-consolidate-womens-health.yml"

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-consolidated-womens-health-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-consolidated-womens-health-20260810
          fetch-depth: 0

      - name: Fetch audited Women's Health sources
        run: |
          set -euo pipefail
          git fetch origin content/cnple-cram-parity-womens-health-46a-20260809
          git fetch origin content/cnple-cram-parity-womens-health-46b-20260809

      - name: Consolidate literal 26-ID Women's Health denominator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          root = Path('content-authoring/cnple/cram')
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('libraryId') != 'cnple-ca-np-cram-v2':
              raise SystemExit('wrong_library')

          required = [
            'id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize',
            'differentiate','assessment','workup','management','medicationSafety','redFlags',
            'counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck'
          ]

          concepts = [
            'contraceptive counseling and selection',
            'IUD insertion and management',
            'implantable contraceptive management',
            'oral contraceptive prescribing and monitoring',
            'emergency contraception counseling',
            'preconception counseling and care',
            'infertility initial evaluation',
            'abnormal uterine bleeding evaluation',
            'dysmenorrhea evaluation and management',
            'endometriosis diagnosis and management',
            'uterine fibroids evaluation and management',
            'polycystic ovary syndrome management',
            'premature ovarian insufficiency',
            'menopause diagnosis and hormone therapy',
            'osteoporosis prevention in women',
            'breast cancer screening and evaluation',
            'cervical cancer screening and management',
            'endometrial cancer recognition',
            'ovarian cancer recognition',
            'vaginitis diagnosis and treatment',
            'pelvic inflammatory disease diagnosis and treatment',
            'sexually transmitted infection management',
            'urinary tract infections in women',
            'pelvic floor disorders evaluation',
            'sexual dysfunction in women',
            'intimate partner violence screening and intervention',
          ]
          def slugify(s):
              import re
              return re.sub(r'(^-|-$)', '', re.sub(r'[^a-z0-9]+','-',s.lower()))[:72]
          target_ids = ['np-' + slugify(c) for c in concepts]
          if len(target_ids) != 26 or len(set(target_ids)) != 26:
              raise SystemExit('womens_denominator_bad')

          def git_json(ref, path):
              raw = subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
              return json.loads(raw)

          sources = []
          sources += git_json('origin/content/cnple-cram-parity-womens-health-46a-20260809', 'content-authoring/cnple/cram/46a-womens-health-parity.json')
          sources += git_json('origin/content/cnple-cram-parity-womens-health-46b-20260809', 'content-authoring/cnple/cram/46b-womens-health-parity.json')
          sources += json.loads((root/'47-womens-health-completion.json').read_text())
          source_by_id = {}
          for row in sources:
              rid = row.get('id')
              if rid in source_by_id and source_by_id[rid] != row:
                  raise SystemExit(f'source_conflict:{rid}')
              source_by_id[rid] = row
          missing_source = [rid for rid in target_ids if rid not in source_by_id]
          extra_source = [rid for rid in source_by_id if rid not in set(target_ids)]
          if missing_source or extra_source:
              raise SystemExit(f'source_denominator_mismatch missing={missing_source} extra={extra_source}')

          existing_by_id = {}
          existing_files = []
          for item in manifest['files']:
              p = root / item['path']
              rows = json.loads(p.read_text())
              if len(rows) != item['lessons']:
                  raise SystemExit(f'manifest_count_mismatch:{item["path"]}')
              existing_files.append((item, rows))
              for row in rows:
                  for key in required:
                      if key not in row:
                          raise SystemExit(f'missing_field:{row.get("id")}:{key}')
                  rid = row['id']
                  if rid in existing_by_id:
                      raise SystemExit(f'global_duplicate_before:{rid}')
                  existing_by_id[rid] = row

          conflicts = []
          already = []
          additions = []
          for rid in target_ids:
              src = source_by_id[rid]
              if rid in existing_by_id:
                  if existing_by_id[rid] != src:
                      conflicts.append(rid)
                  else:
                      already.append(rid)
              else:
                  additions.append(src)
          if conflicts:
              (root/'AUTHORING_WOMENS_HEALTH_CONFLICTS.json').write_text(json.dumps({'conflicts':conflicts}, indent=2)+'\n')
              raise SystemExit('same_id_different_content:' + ','.join(conflicts))

          out_name = '48-womens-health-generator-parity.json'
          out_path = root/out_name
          out_path.write_text(json.dumps(additions, indent=2, ensure_ascii=False)+'\n')
          # Source staging file is replaced by the governed consolidated file.
          (root/'47-womens-health-completion.json').unlink()

          # Import the two existing QA ledgers byte-for-byte under unique consolidation names.
          for ref, src, dst in [
              ('origin/content/cnple-cram-parity-womens-health-46a-20260809','content-authoring/cnple/cram/AUTHORING_QA_PARITY_46A.md','AUTHORING_QA_WOMENS_46A.md'),
              ('origin/content/cnple-cram-parity-womens-health-46b-20260809','content-authoring/cnple/cram/AUTHORING_QA_PARITY_46B.md','AUTHORING_QA_WOMENS_46B.md'),
          ]:
              text = subprocess.check_output(['git','show',f'{ref}:{src}'], text=True)
              (root/dst).write_text(text)

          qa_new = root/'AUTHORING_QA_WOMENS_COMPLETION.md'
          qa_new.write_text('''# CNPLE Women’s Health Generator Completion Audit\n\nDate: 2026-08-10\n\nThe remaining 13 canonical Women’s Health identities were clinically reviewed against current Canadian sources before consolidation. Key gates: screening is separated from symptomatic diagnosis; endometriosis does not require universal surgical confirmation; PCOS is not diagnosed by ultrasound alone; MHT is individualized with endometrial protection when systemic estrogen is used with a uterus; PHAC June 2026 STI/PID guidance supersedes stale regimens; UTI is syndrome-based; IPV response is private, trauma-informed, autonomy-preserving and jurisdiction-aware.\n\nThis audit certifies clinical authoring only. Current Full-source anchors, Bottom Line evidence, exactly three eligible Quick Checks, runtime certification and learner rendering remain downstream fail-closed gates.\n''')

          if additions:
              manifest['files'].append({'path':out_name,'lessons':len(additions),'role':'full_lesson_parity_expansion'})
          audits = manifest.setdefault('auditDocuments', [])
          for name in ['AUTHORING_QA_WOMENS_46A.md','AUTHORING_QA_WOMENS_46B.md','AUTHORING_QA_WOMENS_COMPLETION.md']:
              if name not in audits: audits.append(name)

          manifest['rawLessonObjects'] += len(additions)
          manifest['uniqueLessonIds'] += len(additions)
          manifest['canonicalTopicPathways'] += len(additions)
          manifest['clinicalJsonFiles'] += 1 if additions else 0
          manifest['sourceRefreshDate'] = '2026-08-10'
          manifest['structuralValidation']['validatedAt'] = '2026-08-10'
          manifest['structuralValidation']['status'] = 'PASS'
          manifest['fullLessonParity']['authoringCanonicalTopicPathways'] = manifest['canonicalTopicPathways']
          manifest['publication']['fullLessonCramParityComplete'] = False

          # Final global parse + field + ID uniqueness validation.
          final_ids = set()
          final_count = 0
          for item in manifest['files']:
              rows = json.loads((root/item['path']).read_text())
              if len(rows) != item['lessons']:
                  raise SystemExit(f'final_count_mismatch:{item["path"]}')
              final_count += len(rows)
              for row in rows:
                  for key in required:
                      if key not in row:
                          raise SystemExit(f'final_missing_field:{row.get("id")}:{key}')
                  rid = row['id']
                  if rid in final_ids: raise SystemExit(f'final_duplicate:{rid}')
                  final_ids.add(rid)
          if final_count != manifest['rawLessonObjects'] or len(final_ids) != manifest['uniqueLessonIds']:
              raise SystemExit(f'final_manifest_arithmetic:{final_count}:{len(final_ids)}')
          canonical = manifest['rawLessonObjects'] - manifest.get('explicitCanonicalSupersessions',0)
          if canonical != manifest['canonicalTopicPathways']:
              raise SystemExit(f'canonical_arithmetic:{canonical}!={manifest["canonicalTopicPathways"]}')
          if not set(target_ids).issubset(final_ids):
              raise SystemExit('womens_26_not_complete')

          ledger = {
            'schemaVersion': 1,
            'generatedAt': '2026-08-10',
            'canonicalWomenHealthDenominator': 26,
            'targetIds': target_ids,
            'alreadyPresentExact': already,
            'newlyImported': [r['id'] for r in additions],
            'newlyImportedCount': len(additions),
            'finalManifest': {
              'rawLessonObjects': manifest['rawLessonObjects'],
              'uniqueLessonIds': manifest['uniqueLessonIds'],
              'canonicalTopicPathways': manifest['canonicalTopicPathways'],
              'clinicalJsonFiles': manifest['clinicalJsonFiles'],
            },
            'publication': {'authoringParityCompleteForWomensHealthGenerator': True, 'runtimeCertified': False}
          }
          (root/'AUTHORING_CONSOLIDATION_WOMENS_HEALTH.json').write_text(json.dumps(ledger,indent=2)+'\n')
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(ledger,indent=2))
          PY

      - name: Commit governed consolidation
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-consolidate-womens-health.yml
          git add content-authoring/cnple/cram
          git diff --cached --check
          git commit -m 'content(cnple-cram): consolidate complete womens health parity'
          git push origin HEAD:content/cnple-cram-parity-consolidated-womens-health-20260810
