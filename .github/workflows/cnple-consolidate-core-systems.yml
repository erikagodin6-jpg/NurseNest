name: CNPLE Consolidate Core Systems

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-consolidate-core-systems.yml

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-consolidated-core-systems-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-consolidated-core-systems-20260809
          fetch-depth: 0
      - name: Fetch audited source lineages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            content/cnple-cram-parity-cardiovascular-40d-20260809 \
            content/cnple-cram-parity-diagnostics-40a-20260809 \
            content/cnple-cram-parity-professional-41a-20260809 \
            content/cnple-cram-parity-primary-care-42a-20260809
      - name: Deduplicate and consolidate exact generator identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path

          ROOT=Path('content-authoring/cnple/cram')
          manifest_path=ROOT/'manifest.json'
          m=json.loads(manifest_path.read_text())
          start=(m['rawLessonObjects'],m['uniqueLessonIds'],m['canonicalTopicPathways'],m['clinicalJsonFiles'])
          if start != (570,570,562,60):
              raise SystemExit(f'refusing: consolidation base {start} != (570,570,562,60)')

          # Carry forward the canonical CBC identity correction even if the one-shot fixer has not yet committed.
          cbc=ROOT/'38d-lab-cbc-electrolyte-acid-base-parity.json'
          rows=json.loads(cbc.read_text())
          old=[r for r in rows if r.get('id')=='lab-cbc-interpretation']
          new=[r for r in rows if r.get('id')=='lab-complete-blood-count']
          if len(old)==1 and not new:
              old[0]['id']='lab-complete-blood-count'
              cbc.write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
          elif not old and len(new)==1:
              pass
          else:
              raise SystemExit(f'unexpected CBC identity state old={len(old)} new={len(new)}')
          qa=ROOT/'AUTHORING_QA_PARITY_38D.md'
          if qa.exists():
              t=qa.read_text().replace('- `lab-cbc-interpretation`','- `lab-complete-blood-count`')
              t=t.replace('All IDs are the literal slugs generated by the canonical shared Lab Interpretation curriculum generator.','All IDs match the literal slugs generated by the canonical shared Lab Interpretation curriculum generator. The CBC identity was corrected from the earlier authoring alias `lab-cbc-interpretation` to canonical `lab-complete-blood-count`; clinical content was unchanged.')
              qa.write_text(t)

          def slugify(x):
              return re.sub(r'^-|-$','',re.sub(r'[^a-z0-9]+','-',x.lower()))[:72]
          def np_ids(concepts): return {f'np-{slugify(x)}' for x in concepts}
          def show_json(branch,path):
              raw=subprocess.check_output(['git','show',f'origin/{branch}:{path}'],text=True)
              return json.loads(raw)

          concepts={
            'cardiovascular':[
              'hypertension diagnosis and guideline based management','coronary artery disease risk stratification and management','heart failure with reduced and preserved ejection fraction','atrial fibrillation rate versus rhythm control decisions','stable angina diagnostic workup and treatment','acute coronary syndrome recognition and initial management','valvular heart disease murmur recognition and referral','peripheral artery disease diagnosis and management','deep vein thrombosis and pulmonary embolism management','hyperlipidemia statin selection and monitoring','syncope differential diagnosis and workup','palpitations evaluation and management','anticoagulation management and reversal strategies','cardiomyopathy classification and management','pericarditis and myocarditis diagnosis','aortic stenosis severity assessment and timing of intervention','mitral valve prolapse evaluation and counseling','hypertensive urgency versus emergency decision making','cardiac biomarker interpretation in acute settings','ECG interpretation for advanced practice','stress test selection and result interpretation','echocardiogram findings and clinical correlation','cardiac CT and MRI indications in outpatient practice','cardiovascular disease prevention strategies','post MI secondary prevention and rehabilitation','heart failure medication titration and monitoring','device therapy indications pacemakers and ICDs','endocarditis prophylaxis guidelines and risk stratification'
            ],
            'diagnostics':[
              'complete blood count interpretation','comprehensive metabolic panel interpretation','lipid panel interpretation','thyroid function test interpretation','liver enzyme pattern recognition','cardiac biomarker interpretation','tumor marker interpretation','inflammatory marker interpretation','coagulation studies interpretation','urinalysis fundamentals','arterial blood gas interpretation','ECG interpretation fundamentals','chest x-ray interpretation','abdominal imaging selection','musculoskeletal imaging selection','neuroimaging indications and interpretation','ultrasound in primary care','CT indications and contraindications','MRI indications and contraindications','nuclear medicine studies','screening test interpretation','diagnostic test sensitivity and specificity','point of care testing','microbiology test interpretation','immunology test interpretation','genetic testing considerations'
            ],
            'professional':[
              'NP scope of practice and regulation','prescriptive authority and regulations','controlled substance registration','malpractice and liability','informed consent','confidentiality and HIPAA','mandatory reporting requirements','professional boundaries','ethical decision making','cultural competence in practice','health equity and social determinants','interprofessional collaboration','leadership in healthcare','quality and safety improvement','evidence based practice','clinical practice guidelines','continuing education requirements','certification and recertification','career development for NPs','practice transition and onboarding','mentorship and precepting','research utilization','policy and advocacy','healthcare systems and finance','value based care','population health and public health'
            ],
            'primaryCare':[
              'comprehensive preventive care','health maintenance visit structure','screening guidelines by age and risk','immunization recommendations','lifestyle counseling strategies','nutrition counseling fundamentals','exercise prescription','weight management strategies','tobacco cessation interventions','alcohol screening and brief intervention','substance use screening','sexual health counseling','travel medicine basics','occupational health considerations','disability determination basics','workers compensation considerations','school and sports physicals','chronic disease management models','care coordination and referral','population health management','quality improvement in practice','patient centered medical home','team based care models','telehealth best practices','documentation and coding basics','practice management fundamentals'
            ]
          }
          expected={k:np_ids(v) for k,v in concepts.items()}

          sources={
            'cardiovascular':('content/cnple-cram-parity-cardiovascular-40d-20260809',[
              'content-authoring/cnple/cram/40a-cardiovascular-advanced-parity.json','content-authoring/cnple/cram/40b-cardiovascular-risk-valve-hf-parity.json','content-authoring/cnple/cram/40c-cardiovascular-core-decisions-parity.json','content-authoring/cnple/cram/40d-cardiovascular-diagnostics-devices-parity.json']),
            'diagnostics':('content/cnple-cram-parity-diagnostics-40a-20260809',[
              'content-authoring/cnple/cram/40a-diagnostics-core-parity.json','content-authoring/cnple/cram/40b-diagnostics-testing-imaging-parity.json','content-authoring/cnple/cram/40c-diagnostics-methods-parity.json','content-authoring/cnple/cram/40d-diagnostics-immunology-genetics-parity.json']),
            'professional':('content/cnple-cram-parity-professional-41a-20260809',[
              'content-authoring/cnple/cram/41a-professional-practice-regulatory-parity.json','content-authoring/cnple/cram/41b-professional-equity-quality-parity.json','content-authoring/cnple/cram/41c-professional-development-systems-parity.json']),
            'primaryCare':('content/cnple-cram-parity-primary-care-42a-20260809',[
              'content-authoring/cnple/cram/42a-primary-care-prevention-parity.json','content-authoring/cnple/cram/42b-primary-care-substance-travel-work-parity.json','content-authoring/cnple/cram/42c-primary-care-systems-team-parity.json','content-authoring/cnple/cram/42d-primary-care-documentation-practice-parity.json'])
          }

          source_records={}
          for system,(branch,files) in sources.items():
              rows=[]
              for p in files: rows.extend(show_json(branch,p))
              ids={r['id'] for r in rows}
              if len(ids)!=len(rows): raise SystemExit(f'{system}: duplicate source IDs')
              if ids!=expected[system]:
                  raise SystemExit(f'{system}: generator mismatch missing={sorted(expected[system]-ids)} extra={sorted(ids-expected[system])}')
              source_records[system]=rows

          # Read base IDs after the CBC correction.
          base_by_id={}
          for f in m['files']:
              for r in json.loads((ROOT/f['path']).read_text()):
                  if r['id'] in base_by_id: raise SystemExit(f'base duplicate id {r["id"]}')
                  base_by_id[r['id']]=r

          output_names={
            'cardiovascular':'45a-cardiovascular-generator-parity-consolidated.json',
            'diagnostics':'45b-diagnostics-generator-parity-consolidated.json',
            'professional':'45c-professional-practice-generator-parity-consolidated.json',
            'primaryCare':'45d-primary-care-generator-parity-consolidated.json'
          }
          additions={}; conflicts=[]; exact_existing=[]
          for system,rows in source_records.items():
              fresh=[]
              for r in rows:
                  prev=base_by_id.get(r['id'])
                  if prev is None:
                      fresh.append(r); base_by_id[r['id']]=r
                  elif prev==r:
                      exact_existing.append(r['id'])
                  else:
                      conflicts.append({'system':system,'id':r['id'],'existingTitle':prev.get('title'),'sourceTitle':r.get('title')})
              additions[system]=fresh
          if conflicts:
              (ROOT/'CONSOLIDATION_CONFLICTS_CORE_SYSTEMS.json').write_text(json.dumps(conflicts,indent=2)+'\n')
              raise SystemExit(f'content collisions require adjudication: {len(conflicts)}')

          added_total=0; added_files=0
          for system,rows in additions.items():
              if not rows: continue
              fn=output_names[system]
              (ROOT/fn).write_text(json.dumps(rows,indent=2,ensure_ascii=False)+'\n')
              m['files'].append({'path':fn,'lessons':len(rows),'role':'full_lesson_parity_consolidation'})
              added_total+=len(rows); added_files+=1

          m['rawLessonObjects']=570+added_total
          m['uniqueLessonIds']=570+added_total
          m['canonicalTopicPathways']=m['rawLessonObjects']-m['explicitCanonicalSupersessions']
          m['clinicalJsonFiles']=60+added_files
          m['fullLessonParity']['authoringCanonicalTopicPathways']=m['canonicalTopicPathways']

          # Full global parse/field/id validation after union.
          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          all_ids=[]; total=0
          for f in m['files']:
              data=json.loads((ROOT/f['path']).read_text())
              if len(data)!=f['lessons']: raise SystemExit(f"{f['path']}: {len(data)} != {f['lessons']}")
              for r in data:
                  miss=[k for k in required if k not in r]
                  if miss: raise SystemExit(f"{r.get('id')}: missing {miss}")
                  all_ids.append(r['id'])
              total+=len(data)
          if total!=m['rawLessonObjects'] or len(all_ids)!=total or len(set(all_ids))!=total:
              raise SystemExit(f'global union invalid total={total} ids={len(all_ids)} unique={len(set(all_ids))} manifest={m["rawLessonObjects"]}')
          for system,ids in expected.items():
              missing=ids-set(all_ids)
              if missing: raise SystemExit(f'{system}: missing after consolidation {sorted(missing)}')

          report={
            'schemaVersion':1,'validatedAt':'2026-08-09','status':'PASS','baseRawObjects':570,
            'addedBySystem':{k:len(v) for k,v in additions.items()},'addedTotal':added_total,
            'exactExistingCount':len(exact_existing),'rawLessonObjects':m['rawLessonObjects'],
            'uniqueLessonIds':m['uniqueLessonIds'],'canonicalTopicPathways':m['canonicalTopicPathways'],
            'clinicalJsonFiles':m['clinicalJsonFiles'],'conflicts':0,
            'generatorParity':{k:len(v) for k,v in expected.items()},
            'cbcIdentity':'lab-complete-blood-count'
          }
          (ROOT/'AUTHORING_CONSOLIDATION_CORE_SYSTEMS.json').write_text(json.dumps(report,indent=2)+'\n')
          m['structuralValidation']={'status':'PASS','jsonParse':True,'requiredFields':True,'uniqueIds':True,'duplicateIdCount':0,'canadianContaminationScan':m.get('structuralValidation',{}).get('canadianContaminationScan','PASS'),'validatedAt':'2026-08-09'}
          if 'AUTHORING_CONSOLIDATION_CORE_SYSTEMS.json' not in m['auditDocuments']: m['auditDocuments'].append('AUTHORING_CONSOLIDATION_CORE_SYSTEMS.json')
          m['publication']['note']='This consolidated authoring estate includes the validated 570-object Lab/Respiratory/Endocrine/GI/Renal/Derm lineage plus deduplicated exact-generator Cardiovascular, Diagnostics, Professional Practice and Primary Care identities. Same-ID/different-content conflicts are prohibited. Full CNPLE curriculum parity and private-core certification remain incomplete.'
          manifest_path.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2))
          PY
          git diff --check -- content-authoring/cnple/cram
      - name: Commit consolidated authoring estate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE consolidation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-consolidate-core-systems.yml
          git add content-authoring/cnple/cram/
          git diff --cached --check
          git commit -m 'content(cnple-cram): consolidate completed generator systems'
          git push origin HEAD:content/cnple-cram-parity-consolidated-core-systems-20260809
