name: CNPLE Consolidate Neurology

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-consolidate-neurology.yml

permissions:
  contents: write

jobs:
  consolidate:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-consolidated-neurology-20260809'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-consolidated-neurology-20260809
          fetch-depth: 0
      - name: Fetch audited Neurology sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin content/cnple-cram-parity-neurology-40b-20260809 content/cnple-cram-parity-neurology-stroke-20260809
      - name: Consolidate exact Neurology generator identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          m=json.loads((root/'manifest.json').read_text())
          start=(m['rawLessonObjects'],m['uniqueLessonIds'],m['canonicalTopicPathways'],m['clinicalJsonFiles'])
          if start!=(702,702,694,65): raise SystemExit(f'base {start} != (702,702,694,65)')
          def slugify(x): return re.sub(r'^-|-$','',re.sub(r'[^a-z0-9]+','-',x.lower()))[:72]
          concepts=['headache differential diagnosis and management','migraine prophylaxis and abortive therapy','tension type headache management','cluster headache diagnosis and treatment','seizure classification and antiepileptic selection','stroke acute management and secondary prevention','TIA workup and risk stratification','Parkinson disease diagnosis and management','essential tremor evaluation and treatment','multiple sclerosis diagnosis and disease modifying therapy','peripheral neuropathy workup and management','dementia diagnosis and disease modifying therapy','delirium recognition and management','meningitis and encephalitis recognition','myasthenia gravis diagnosis and management','Bell palsy evaluation and treatment','carpal tunnel syndrome diagnosis and management','low back pain with radiculopathy management','cervical radiculopathy evaluation','vertigo and dizziness differential diagnosis','syncope neurologic evaluation','neuroimaging in clinical neurology','neuromuscular junction disorders','movement disorders beyond Parkinson disease','neurologic manifestations of systemic disease']
          expected={f'np-{slugify(x)}' for x in concepts}
          expected_base={'np-headache-differential-diagnosis-and-management','np-tension-type-headache-management','np-cluster-headache-diagnosis-and-treatment','np-syncope-neurologic-evaluation'}
          expected_sources=expected-expected_base
          sources=[]
          for p in ['content-authoring/cnple/cram/40a-neurology-high-yield-parity.json','content-authoring/cnple/cram/40b-neurology-diagnostics-neuromuscular-parity.json']:
              raw=subprocess.check_output(['git','show',f'origin/content/cnple-cram-parity-neurology-40b-20260809:{p}'],text=True)
              sources.extend(json.loads(raw))
          raw=subprocess.check_output(['git','show','origin/content/cnple-cram-parity-neurology-stroke-20260809:content-authoring/cnple/cram/46b-neurology-stroke-parity.json'],text=True)
          sources.extend(json.loads(raw))
          source_ids={r['id'] for r in sources}
          if len(sources)!=21 or source_ids!=expected_sources:
              raise SystemExit(f'neurology source mismatch count={len(sources)} missing={sorted(expected_sources-source_ids)} extra={sorted(source_ids-expected_sources)}')
          base={}
          for f in m['files']:
              for r in json.loads((root/f['path']).read_text()):
                  if r['id'] in base: raise SystemExit(f'base duplicate {r["id"]}')
                  base[r['id']]=r
          missing_base=expected_base-set(base)
          if missing_base: raise SystemExit(f'four prerequisite Neurology identities missing from consolidated base: {sorted(missing_base)}')
          fresh=[]; exact=[]; conflicts=[]
          for r in sources:
              prev=base.get(r['id'])
              if prev is None: fresh.append(r); base[r['id']]=r
              elif prev==r: exact.append(r['id'])
              else: conflicts.append({'id':r['id'],'existingTitle':prev.get('title'),'sourceTitle':r.get('title')})
          if conflicts:
              (root/'CONSOLIDATION_CONFLICTS_NEUROLOGY.json').write_text(json.dumps(conflicts,indent=2)+'\n')
              raise SystemExit(f'neurology content conflicts={len(conflicts)}')
          if fresh:
              fn='46b-neurology-generator-parity-consolidated.json'
              (root/fn).write_text(json.dumps(fresh,indent=2,ensure_ascii=False)+'\n')
              m['files'].append({'path':fn,'lessons':len(fresh),'role':'full_lesson_parity_consolidation'})
          added=len(fresh)
          m['rawLessonObjects']=702+added
          m['uniqueLessonIds']=702+added
          m['canonicalTopicPathways']=m['rawLessonObjects']-m['explicitCanonicalSupersessions']
          m['clinicalJsonFiles']=65+(1 if fresh else 0)
          m['fullLessonParity']['authoringCanonicalTopicPathways']=m['canonicalTopicPathways']
          required=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck']
          all_ids=[]; total=0
          for f in m['files']:
              data=json.loads((root/f['path']).read_text()); total+=len(data)
              if len(data)!=f['lessons']: raise SystemExit(f"{f['path']}: count drift")
              for r in data:
                  miss=[k for k in required if k not in r]
                  if miss: raise SystemExit(f"{r.get('id')}: missing {miss}")
                  all_ids.append(r['id'])
          if total!=m['rawLessonObjects'] or len(set(all_ids))!=total: raise SystemExit('post-union global validation failed')
          missing=expected-set(all_ids)
          if missing: raise SystemExit(f'Neurology parity still missing {sorted(missing)}')
          report={'schemaVersion':1,'validatedAt':'2026-08-09','status':'PASS','baseRawObjects':702,'added':added,'exactExisting':len(exact),'conflicts':0,'rawLessonObjects':m['rawLessonObjects'],'uniqueLessonIds':m['uniqueLessonIds'],'canonicalTopicPathways':m['canonicalTopicPathways'],'clinicalJsonFiles':m['clinicalJsonFiles'],'neurologyGeneratorParity':25,'prerequisiteExisting':sorted(expected_base)}
          (root/'AUTHORING_CONSOLIDATION_NEUROLOGY.json').write_text(json.dumps(report,indent=2)+'\n')
          if 'AUTHORING_CONSOLIDATION_NEUROLOGY.json' not in m['auditDocuments']: m['auditDocuments'].append('AUTHORING_CONSOLIDATION_NEUROLOGY.json')
          m['structuralValidation']={'status':'PASS','jsonParse':True,'requiredFields':True,'uniqueIds':True,'duplicateIdCount':0,'canadianContaminationScan':m.get('structuralValidation',{}).get('canadianContaminationScan','PASS'),'validatedAt':'2026-08-09'}
          m['publication']['note']='The deduplicated CNPLE authoring estate now includes exact Neurology generator parity (25/25), including a distinct acute-stroke Full identity and separate TIA/headache/syncope pathways. Full curriculum parity and private-core publication certification remain incomplete.'
          (root/'manifest.json').write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(report,indent=2))
          PY
          git diff --check -- content-authoring/cnple/cram
      - name: Commit Neurology consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE consolidation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-consolidate-neurology.yml
          git add content-authoring/cnple/cram/
          git diff --cached --check
          git commit -m 'content(cnple-cram): consolidate complete neurology generator parity'
          git push origin HEAD:content/cnple-cram-parity-consolidated-neurology-20260809
