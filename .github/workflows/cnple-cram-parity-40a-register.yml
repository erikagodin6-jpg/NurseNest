name: CNPLE Parity 40A Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - content-authoring/cnple/cram/40a-cardiovascular-advanced-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_40A.md
      - .github/workflows/cnple-cram-parity-40a-register.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-cardiovascular-40a-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-cardiovascular-40a-20260809
          fetch-depth: 0
      - name: Validate and register batch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'content-authoring/cnple/cram';
          const mp = `${path}/manifest.json`;
          const m = JSON.parse(fs.readFileSync(mp,'utf8'));
          if (m.rawLessonObjects !== 467 || m.uniqueLessonIds !== 467 || m.canonicalTopicPathways !== 459 || m.clinicalJsonFiles !== 48) {
            throw new Error(`unexpected predecessor ${m.rawLessonObjects}/${m.uniqueLessonIds}/${m.canonicalTopicPathways}/${m.clinicalJsonFiles}`);
          }
          const batchPath = '40a-cardiovascular-advanced-parity.json';
          if (m.files.some(f => f.path === batchPath)) throw new Error('40A already registered');
          const rows = JSON.parse(fs.readFileSync(`${path}/${batchPath}`,'utf8'));
          const expected = [
            'np-palpitations-evaluation-and-management',
            'np-cardiomyopathy-classification-and-management',
            'np-mitral-valve-prolapse-evaluation-and-counseling',
            'np-stress-test-selection-and-result-interpretation',
            'np-echocardiogram-findings-and-clinical-correlation',
            'np-cardiac-ct-and-mri-indications-in-outpatient-practice',
            'np-post-mi-secondary-prevention-and-rehabilitation',
            'np-endocarditis-prophylaxis-guidelines-and-risk-stratification',
          ];
          if (rows.length !== 8 || rows.map(r=>r.id).join('|') !== expected.join('|')) throw new Error('40A identity mismatch');
          const required = ['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck'];
          for (const r of rows) for (const k of required) if (!(k in r)) throw new Error(`missing ${k} in ${r.id}`);
          m.files.push({path:batchPath,lessons:8,role:'full_lesson_parity_expansion'});
          m.rawLessonObjects = 475;
          m.uniqueLessonIds = 475;
          m.canonicalTopicPathways = 467;
          m.clinicalJsonFiles = 49;
          m.sourceRefreshDate = '2026-08-09';
          m.auditDocuments = [...new Set([...(m.auditDocuments||[]),'AUTHORING_QA_PARITY_40A.md'])];
          m.fullLessonParity = {...m.fullLessonParity, status:'IN_PROGRESS', authoringCanonicalTopicPathways:467};
          m.publication = {...m.publication, fullLessonCramParityComplete:false, secondPassClinicalAuditCompleteForParity40A:true, newExpansionBatchPendingSecondPassAudit:false, rendererMappingComplete:false, productionMerged:false, productionDeployed:false};
          fs.writeFileSync(mp, JSON.stringify(m,null,2)+'\n');

          const allIds = new Set(); let total = 0;
          for (const f of m.files) {
            const data = JSON.parse(fs.readFileSync(`${path}/${f.path}`,'utf8'));
            if (!Array.isArray(data) || data.length !== f.lessons) throw new Error(`count mismatch ${f.path}`);
            total += data.length;
            for (const r of data) {
              if (!r.id || allIds.has(r.id)) throw new Error(`duplicate/missing id ${r.id}`);
              allIds.add(r.id);
              for (const k of required) if (!(k in r)) throw new Error(`missing ${k} in ${r.id}`);
            }
          }
          if (total !== 475 || allIds.size !== 475) throw new Error(`global count mismatch ${total}/${allIds.size}`);
          NODE
      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-cram-parity-40a-register.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/40a-cardiovascular-advanced-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_40A.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): register cardiovascular parity batch 40A'
          git push origin HEAD:content/cnple-cram-parity-cardiovascular-40a-20260809
