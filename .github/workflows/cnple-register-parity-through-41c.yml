name: CNPLE Register Parity through 41C

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/cnple-register-parity-through-41c.yml"
      - "content-authoring/cnple/cram/*.json"
      - "content-authoring/cnple/cram/AUTHORING_QA_PARITY_*.md"

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-gi-41c-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-gi-41c-20260809
          fetch-depth: 0

      - name: Validate and register audited parity through GI 41C
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('content-authoring/cnple/cram')
          mp=root/'manifest.json'
          m=json.loads(mp.read_text())
          assert (m['rawLessonObjects'],m['uniqueLessonIds'],m['canonicalTopicPathways'],m['clinicalJsonFiles'])==(426,426,418,42)
          assert m['explicitCanonicalSupersessions']==8
          pending=[
            ('38d-lab-cbc-electrolyte-acid-base-parity.json',8,'AUTHORING_QA_PARITY_38D.md'),
            ('38e-lab-advanced-patterns-parity.json',8,'AUTHORING_QA_PARITY_38E.md'),
            ('39a-respiratory-advanced-parity.json',6,'AUTHORING_QA_PARITY_39A.md'),
            ('39b-respiratory-diagnostics-procedures-parity.json',5,'AUTHORING_QA_PARITY_39B.md'),
            ('39c-respiratory-diagnostics-screening-parity.json',8,'AUTHORING_QA_PARITY_39C.md'),
            ('39d-respiratory-core-completion-parity.json',6,'AUTHORING_QA_PARITY_39D.md'),
            ('40a-endocrine-diabetes-parity.json',8,'AUTHORING_QA_PARITY_40A.md'),
            ('40b-endocrine-thyroid-adrenal-parathyroid-parity.json',8,'AUTHORING_QA_PARITY_40B.md'),
            ('40c-endocrine-bone-metabolic-parity.json',10,'AUTHORING_QA_PARITY_40C.md'),
            ('41a-gi-upper-inflammatory-liver-parity.json',9,'AUTHORING_QA_PARITY_41A.md'),
            ('41b-gi-cirrhosis-pancreas-colon-parity.json',9,'AUTHORING_QA_PARITY_41B.md'),
            ('41c-gi-diagnostics-nutrition-completion-parity.json',8,'AUTHORING_QA_PARITY_41C.md'),
          ]
          required=set(m['requiredLessonFields'])
          registered={e['path'] for e in m['files']}
          assert not registered.intersection({p for p,_,_ in pending})
          ids=set(); total=0
          for e in m['files']:
            rows=json.loads((root/e['path']).read_text())
            assert len(rows)==e['lessons']
            total+=len(rows)
            for row in rows:
              assert required.issubset(row.keys())
              assert row['id'] not in ids
              ids.add(row['id'])
          assert total==426 and len(ids)==426
          for path,n,qa in pending:
            assert (root/path).exists(), path
            assert (root/qa).exists(), qa
            rows=json.loads((root/path).read_text())
            assert len(rows)==n, (path,len(rows),n)
            for row in rows:
              assert required.issubset(row.keys()), f'missing:{path}:{row.get("id")}'
              assert isinstance(row['id'],str) and row['id'].strip()
              assert row['id'] not in ids, f'duplicate:{row["id"]}'
              ids.add(row['id'])
            m['files'].append({'path':path,'lessons':n,'role':'full_lesson_parity_expansion'})
            if qa not in m['auditDocuments']:
              m['auditDocuments'].append(qa)
          assert len(ids)==519, len(ids)
          m['rawLessonObjects']=519
          m['uniqueLessonIds']=519
          m['canonicalTopicPathways']=511
          m['clinicalJsonFiles']=54
          m['sourceRefreshDate']='2026-08-09'
          m['fullLessonParity']['authoringCanonicalTopicPathways']=511
          pub=m['publication']
          for key in ['38D','38E','39A','39B','39C','39D','40A','40B','40C','41A','41B','41C']:
            pub[f'secondPassClinicalAuditCompleteForParity{key}']=True
          pub['newExpansionBatchPendingSecondPassAudit']=False
          pub['note']=(
            'The 519-object CNPLE Cram V2 estate contains the audited baseline plus clinically reviewed Full-lesson parity expansions. '
            'The canonical shared Lab Interpretation and the canonical NP Respiratory, Endocrine, and Gastrointestinal generator families now have complete clinical authoring coverage. '
            'Global Full-lesson parity remains incomplete; private-core exact-current-Full reconciliation, source anchors, Bottom Line evidence, Quick Checks, runtime certification, and learner rendering remain mandatory.'
          )
          mp.write_text(json.dumps(m,indent=2)+'\n')
          check=json.loads(mp.read_text())
          assert len(check['files'])==54
          ids2=set(); total2=0
          for e in check['files']:
            rows=json.loads((root/e['path']).read_text())
            assert len(rows)==e['lessons']
            total2+=len(rows)
            for row in rows:
              assert required.issubset(row.keys())
              assert row['id'] not in ids2
              ids2.add(row['id'])
          assert (total2,len(ids2),check['canonicalTopicPathways'])==(519,519,511)
          print(json.dumps({'rawLessonObjects':519,'uniqueLessonIds':519,'canonicalTopicPathways':511,'clinicalJsonFiles':54}))
          PY

      - name: Commit governed registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-register-parity-through-41c.yml
          git add content-authoring/cnple/cram/manifest.json
          git diff --cached --check
          git commit -m 'content(cnple-cram): register parity through GI 41C'
          git push origin HEAD:content/cnple-cram-parity-gi-41c-20260809
