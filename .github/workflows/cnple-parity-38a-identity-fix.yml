name: CNPLE Parity 38A Identity Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-parity-38a-identity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-labs-38a-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-labs-38a-20260808
          fetch-depth: 0

      - name: Correct five parity identities and audit text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
            '"id": "lab-abg"': '"id": "lab-abg-fundamentals"',
            '"id": "lab-pt-inr"': '"id": "lab-pt-and-inr"',
            '"id": "lab-troponin-interpretation"': '"id": "lab-troponin"',
            '"id": "lab-bnp-ntprobnp"': '"id": "lab-bnp-and-heart-failure"',
            '"id": "lab-lactate-interpretation"': '"id": "lab-lactate"',
            '`lab-abg`': '`lab-abg-fundamentals`',
            '`lab-pt-inr`': '`lab-pt-and-inr`',
            '`lab-troponin-interpretation`': '`lab-troponin`',
            '`lab-bnp-ntprobnp`': '`lab-bnp-and-heart-failure`',
            '`lab-lactate-interpretation`': '`lab-lactate`',
          }
          files = [
            Path('content-authoring/cnple/cram/38a-lab-interpretation-parity.json'),
            Path('content-authoring/cnple/cram/AUTHORING_QA_PARITY_38A.md'),
          ]
          for p in files:
            text = p.read_text()
            for old, new in replacements.items():
              if old in text:
                text = text.replace(old, new)
            p.write_text(text)
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('content-authoring/cnple/cram/38a-lab-interpretation-parity.json').read_text())
          ids=[r['id'] for r in rows]
          expected=[
            'lab-a1c-interpretation',
            'lab-abg-fundamentals',
            'lab-aptt',
            'lab-pt-and-inr',
            'lab-d-dimer',
            'lab-troponin',
            'lab-bnp-and-heart-failure',
            'lab-lactate',
          ]
          if ids != expected:
            raise SystemExit(f'identity mismatch: {ids!r}')
          if len(set(ids)) != 8:
            raise SystemExit('duplicate ids after correction')
          print('38A canonical IDs:', ids)
          PY

      - name: Commit corrections and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-parity-38a-identity-fix.yml
          git add content-authoring/cnple/cram/38a-lab-interpretation-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_38A.md
          git diff --cached --check
          git commit -m 'fix(cnple-cram): use canonical Full-lesson IDs for lab parity 38A'
          git push origin HEAD:content/cnple-cram-parity-labs-38a-20260808
