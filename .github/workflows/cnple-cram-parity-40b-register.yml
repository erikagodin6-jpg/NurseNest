name: CNPLE Parity 40B Register

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - content-authoring/cnple/cram/40b-cardiovascular-risk-valve-hf-parity.json
      - content-authoring/cnple/cram/AUTHORING_QA_PARITY_40B.md
      - .github/workflows/cnple-cram-parity-40b-register.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-cardiovascular-40b-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-cardiovascular-40b-20260809
          fetch-depth: 0
      - name: Sync validated 40A predecessor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin content/cnple-cram-parity-cardiovascular-40a-20260809
          git merge --no-edit origin/content/cnple-cram-parity-cardiovascular-40a-20260809
      - name: Validate and register batch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const root='content-authoring/cnple/cram'; const mp=`${root}/manifest.json`; const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.rawLessonObjects!==475||m.uniqueLessonIds!==475||m.canonicalTopicPathways!==467||m.clinicalJsonFiles!==49) throw new Error(`unexpected predecessor ${m.rawLessonObjects}/${m.uniqueLessonIds}/${m.canonicalTopicPathways}/${m.clinicalJsonFiles}`);
          const batch='40b-cardiovascular-risk-valve-hf-parity.json'; if(m.files.some(f=>f.path===batch)) throw new Error('40B already registered');
          const rows=JSON.parse(fs.readFileSync(`${root}/${batch}`,'utf8'));
          const expected=['np-coronary-artery-disease-risk-stratification-and-management','np-stable-angina-diagnostic-workup-and-treatment','np-valvular-heart-disease-murmur-recognition-and-referral','np-peripheral-artery-disease-diagnosis-and-management','np-anticoagulation-management-and-reversal-strategies','np-aortic-stenosis-severity-assessment-and-timing-of-intervention','np-cardiovascular-disease-prevention-strategies','np-heart-failure-medication-titration-and-monitoring'];
          if(rows.length!==8||rows.map(r=>r.id).join('|')!==expected.join('|')) throw new Error('40B identity mismatch');
          const req=['id','title','system','blueprintDomains','lifespan','acuity','bottomLine','recognize','differentiate','assessment','workup','management','medicationSafety','redFlags','counselling','followUp','examTrap','oneLinePearl','sourceBasis','sourceAsOf','localPolicyCheck'];
          for(const r of rows) for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);
          m.files.push({path:batch,lessons:8,role:'full_lesson_parity_expansion'}); m.rawLessonObjects=483; m.uniqueLessonIds=483; m.canonicalTopicPathways=475; m.clinicalJsonFiles=50; m.sourceRefreshDate='2026-08-09';
          m.auditDocuments=[...new Set([...(m.auditDocuments||[]),'AUTHORING_QA_PARITY_40B.md'])]; m.fullLessonParity={...m.fullLessonParity,status:'IN_PROGRESS',authoringCanonicalTopicPathways:475}; m.publication={...m.publication,fullLessonCramParityComplete:false,secondPassClinicalAuditCompleteForParity40B:true,newExpansionBatchPendingSecondPassAudit:false,rendererMappingComplete:false,productionMerged:false,productionDeployed:false}; fs.writeFileSync(mp,JSON.stringify(m,null,2)+'\n');
          const ids=new Set(); let total=0; for(const f of m.files){const data=JSON.parse(fs.readFileSync(`${root}/${f.path}`,'utf8')); if(!Array.isArray(data)||data.length!==f.lessons) throw new Error(`count mismatch ${f.path}`); total+=data.length; for(const r of data){if(!r.id||ids.has(r.id)) throw new Error(`duplicate/missing id ${r.id}`); ids.add(r.id); for(const k of req) if(!(k in r)) throw new Error(`missing ${k} in ${r.id}`);}}
          if(total!==483||ids.size!==483) throw new Error(`global mismatch ${total}/${ids.size}`);
          NODE
      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cnple-cram-parity-40b-register.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/40b-cardiovascular-risk-valve-hf-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_40B.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): register cardiovascular parity batch 40B'
          git push origin HEAD:content/cnple-cram-parity-cardiovascular-40b-20260809
