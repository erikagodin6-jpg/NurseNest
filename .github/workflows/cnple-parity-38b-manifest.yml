name: CNPLE Parity 38B Manifest Registration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/cnple-parity-38b-manifest.yml

permissions:
  contents: write

jobs:
  register:
    if: github.event.pull_request.head.ref == 'content/cnple-cram-parity-labs-38b-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: content/cnple-cram-parity-labs-38b-20260808
          fetch-depth: 0

      - name: Register batch 38B with strict predecessor invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path('content-authoring/cnple/cram')
          manifest_path=root/'manifest.json'
          m=json.loads(manifest_path.read_text())
          if m.get('rawLessonObjects') != 410 or m.get('uniqueLessonIds') != 410:
              raise SystemExit(f"refusing: expected audited 410-object predecessor, got {m.get('rawLessonObjects')}/{m.get('uniqueLessonIds')}")
          if m.get('canonicalTopicPathways') != 402 or m.get('clinicalJsonFiles') != 40:
              raise SystemExit('refusing: predecessor canonical/file counts do not match 38A state')
          if not any(f.get('path') == '38a-lab-interpretation-parity.json' and f.get('lessons') == 8 for f in m.get('files', [])):
              raise SystemExit('refusing: 38A is not registered')
          if any(f.get('path') == '38b-lab-interpretation-parity.json' for f in m.get('files', [])):
              raise SystemExit('refusing: 38B already registered')

          rows=json.loads((root/'38b-lab-interpretation-parity.json').read_text())
          if len(rows) != 8:
              raise SystemExit(f'refusing: expected 8 38B records, found {len(rows)}')
          ids=[r.get('id') for r in rows]
          if len(set(ids)) != 8 or any(not isinstance(x,str) or not x for x in ids):
              raise SystemExit('refusing: invalid/duplicate 38B ids')
          expected={
            'lab-bun-and-creatinine','lab-egfr-and-renal-function','lab-acute-kidney-injury-lab-trends',
            'lab-sodium-disorders','lab-potassium-disorders','lab-phosphate-disorders',
            'lab-hemoglobin-and-hematocrit','lab-white-blood-cells-and-differential'
          }
          if set(ids) != expected:
              raise SystemExit(f'refusing: 38B IDs do not match canonical Full slugs: {ids!r}')

          m['rawLessonObjects']=418
          m['uniqueLessonIds']=418
          m['canonicalTopicPathways']=410
          m['clinicalJsonFiles']=41
          m['files'].append({'path':'38b-lab-interpretation-parity.json','lessons':8,'role':'full_lesson_parity_expansion'})
          docs=m.setdefault('auditDocuments',[])
          if 'AUTHORING_QA_PARITY_38B.md' not in docs:
              docs.append('AUTHORING_QA_PARITY_38B.md')
          parity=m.setdefault('fullLessonParity',{})
          parity['authoringCanonicalTopicPathways']=410
          pub=m.setdefault('publication',{})
          pub['secondPassClinicalAuditCompleteForParity38B']=True
          pub['newExpansionBatchPendingSecondPassAudit']=False
          pub['fullLessonCramParityComplete']=False
          pub['note']='The 418-object library is an audited topic baseline plus active Full-lesson parity expansions. Batches 37, 38A and 38B have passed clinical second-pass review; parse/identity/source/Quick-Check/shared-runtime certification remains required. CNPLE Cram authoring stays open until reverse coverage reaches 100% and every weak Full source and Cram certification gate is resolved.'
          manifest_path.write_text(json.dumps(m, indent=2, ensure_ascii=False)+'\n')

          # Re-open and prove all registered file counts reconcile after mutation.
          check=json.loads(manifest_path.read_text())
          total=0
          seen=[]
          for f in check['files']:
              data=json.loads((root/f['path']).read_text())
              if len(data) != f['lessons']:
                  raise SystemExit(f"manifest/file count mismatch: {f['path']} {len(data)} != {f['lessons']}")
              total += len(data)
              seen.extend(r['id'] for r in data)
          if total != 418 or len(seen) != 418 or len(set(seen)) != 418:
              raise SystemExit(f'global V2 invariant failed: total={total} ids={len(seen)} unique={len(set(seen))}')
          if check['canonicalTopicPathways'] != check['uniqueLessonIds'] - check['explicitCanonicalSupersessions']:
              raise SystemExit('canonical count arithmetic failed')
          print(json.dumps({k:check[k] for k in ['rawLessonObjects','uniqueLessonIds','canonicalTopicPathways','clinicalJsonFiles']}, indent=2))
          PY

      - name: Commit registration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurseNest CNPLE authoring'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cnple-parity-38b-manifest.yml
          git add content-authoring/cnple/cram/manifest.json content-authoring/cnple/cram/38b-lab-interpretation-parity.json content-authoring/cnple/cram/AUTHORING_QA_PARITY_38B.md
          git diff --cached --check
          git commit -m 'content(cnple-cram): register lab parity batch 38B'
          git push origin HEAD:content/cnple-cram-parity-labs-38b-20260808
